 const boss=run.enemies.find(x=>x.type==='boss'||x.type==='duelist');$('boss-ui').hidden=!boss;if(boss){$('boss-title').textContent=boss.name;$('boss-percent').textContent=Math.ceil(boss.hp/boss.maxHp*100)+'%';$('boss-fill').style.width=E.clamp(boss.hp/boss.maxHp*100,0,100)+'%';$('boss-phase').textContent=boss.phase===2?'第二阶段 · 狂暴觉醒':'第一阶段 · 留意攻击预警'}
 const title=E.modes[run.mode].name;let text='';if(run.mode==='world'){const n=run.shrines.filter(x=>x.active).length,near=run.shrines.find(x=>!x.active&&Math.hypot(x.x-p.x,x.y-p.y)<110);text=`<b>${title}</b>祭坛 ${n} / 3 · 宝箱 ${run.chests.filter(x=>x.open).length} / 4${near?'<br><button class="btn small" style="pointer-events:auto;min-height:26px;background:#143032d9;margin-top:6px" data-action="interact">激活祭坛 · F</button>':`<br><small>${n===3?'击败蚀星守卫':'小地图的菱形为祭坛'}</small>`}`}else text=`<b>${title}</b>${run.mode==='duel'?'击败神裔镜像':`第 ${run.wave||1} 重${run.mode==='campaign'?' / 5':''} · ${E.chapters[run.chapter].name}`}<br><small>${run.difficulty==='hard'?'逆天':run.difficulty==='story'?'初醒':'天命'} · ${run.enemies.length} 名来敌</small>`;
 if($('objective').innerHTML!==text)$('objective').innerHTML=text;
 for(let i=0;i<3;i++){const b=$('skill-'+i),cd=p.cd[i];b.classList.toggle('cooling',cd>0);b.querySelector('i').textContent=cd>0?Math.ceil(cd):'';b.setAttribute('aria-label',`${E.heroes[run.hero].skills[i].name} ${cd>0?'冷却 '+Math.ceil(cd)+' 秒':'可用'}`)}const d=$('skill-dash');d.classList.toggle('cooling',p.dashCd>0);d.querySelector('i').textContent=p.dashCd>0?p.dashCd.toFixed(1):'';

function fx(type,data){if(vis.fx.length>(S.settings.reduce?70:S.settings.quality==='low'?160:320))return;vis.fx.push({type,t:0,life:.55,x:0,y:0,color:'#e9c078',...data})}
function burst(x,y,col,count=10){if(S.settings.reduce)count=Math.min(4,count);for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,v=30+Math.random()*100;fx('particle',{x,y,color:col,life:.4+Math.random()*.5,dx:Math.cos(a)*v,dy:Math.sin(a)*v,size:1.2+Math.random()*2,z:10+Math.random()*38})}}
function consumeEvents(){if(!run)return;const events=run.events.splice(0);for(const e of events){switch(e.type){case'hit':fx('text',{x:e.x,y:e.y,text:e.value,color:e.crit?'#f4dca0':'#d3dfce',crit:e.crit,life:.7,dx:(Math.random()-.5)*25});burst(e.x,e.y,e.color,3);AudioEngine.sfx('hit');break;case'hurt':fx('text',{x:e.x,y:e.y,text:'−'+e.value,color:'#efa48f',life:.8,dx:0});AudioEngine.sfx('hurt');break;case'slash':fx('slash',{...e,life:.24});break;case'ring':case'ultimate':case'nova':case'enemyImpact':fx(e.type,{...e,color:e.type==='enemyImpact'?'#ef8d76':e.color||'#e9c078',life:e.type==='ultimate'?1:.5});burst(e.x,e.y,e.color||'#e9c078',e.type==='ultimate'?30:8);break;case'lightning':fx('lightning',{...e,life:.3});break;case'attack':AudioEngine.sfx('attack');break;case'kill':case'death':burst(e.x,e.y,e.color||'#adc4b3',12);AudioEngine.sfx('kill');break;case'bossDead':fx('ultimate',{...e,color:'#ead09c',radius:250,life:1.5});burst(e.x,e.y,'#ead09c',40);AudioEngine.sfx('ultimate');break;case'dash':AudioEngine.sfx('dash');break;case'trail':fx('trail',{...e,life:.2});break;case'skill':AudioEngine.sfx(e.i===2?'ultimate':'skill');if(e.i===2)announce(e.name,'神裔觉醒');break;case'spawn':if(e.boss)fx('ring',{...e,color:'#eea182',radius:80,life:1});break;case'announce':announce(e.title,e.sub);break;case'choice':showChoice();break;case'end':finish();break;case'level':toast('神裔觉醒 · 局内 LV.'+e.level);fx('ring',{x:run.p.x,y:run.p.y,color:'#c6e0a6',radius:110});AudioEngine.sfx('level');break;case'upgrade':toast('天命赐福 · '+e.name);break;case'notice':toast(e.text);break;case'heal':AudioEngine.sfx('heal');burst(e.x,e.y,'#b1dfa5',8);break;case'shrine':toast('祭坛已点亮 · +160 灵铢 / +15 天晶');fx('ultimate',{...e,color:'#e9d59a',radius:180,life:1});AudioEngine.sfx('level');break;case'chest':toast('星庭宝箱 · +120 灵铢 / +8 天晶');burst(e.x,e.y,'#ead3a0',16);AudioEngine.sfx('chest');break;}}
}
function getMovement(){return{mx:(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joy.x,my:(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+joy.y}}
function skill(i){if(!run||paused)return;E.useSkill(run,i);consumeEvents();updateHUD()}
function dash(){if(!run||paused)return;const m=getMovement();E.useDash(run,m.mx,m.my);consumeEvents();updateHUD()}
function exportSave(){if(run)save(true);const data=JSON.stringify(S,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='智阳神传-天启-存档-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('存档已导出，请保留 JSON 文件')}
function openSlot(i){const active=S.loadouts[S.hero]||[],html=Object.entries(E.runes).map(([id,r])=>`<button class="btn small ${active[i]===id?'primary':''}" data-set-rune="${id}" data-slot-index="${i}" style="justify-content:flex-start"><span style="font:20px var(--serif);color:${active[i]===id?'#32413a':r.color}">${r.glyph}</span>${r.name} · LV.${S.runes[id]}</button>`).join('');modal(`${modalHead('配置第 '+(i+1)+' 枚灵印')}<p class="modal-subtitle">${E.heroes[S.hero].name}的灵印配置 · ${active[i]?E.runes[active[i]].name:'空槽'}<br>灵印可重复装备，效果叠加。选择后立即生效。</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">${html}</div><div class="modal-actions"><button class="btn" data-set-rune="none" data-slot-index="${i}">清空此槽</button><button class="btn" data-action="close">返回</button></div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;AudioEngine.init();AudioEngine.sfx('click');const d=b.dataset;
 if(d.page){window.scrollTo(0,0);renderPage(d.page);return}
 if(d.skin){const k=d.skin,s=E.skins[k];if(!s)return;if(!S.ownedSkins.includes(k)){if(S.gems<s.price)return;S.gems-=s.price;S.ownedSkins.push(k)}S.skin=k;Painter.setAppearance(k);save();refreshTop();market();toast(s.name+'已穿戴');return}
 if(d.action==='market'){market();return}
 if(d.action==='exchange'){if(S.gems>=100){S.gems-=100;S.gold+=1500;save();refreshTop();market();toast('补给已送达 · +1500 灵铢')}return}
 if(d.launch){launchModal(d.launch,Number(d.chapter)||0);return}
 if(d.newRun){const old=E.restoreRun(S.suspended);if(old){E.award(S,old,true,dateKey())}S.suspended=null;save();closeModal();launchModal(d.newRun,Number(d.chapter)||0);return}
 if(d.heroDetail){selectedHero=d.heroDetail;renderPage();return}
 if(d.filter){heroFilter=d.filter;renderPage();return}
 if(d.equipHero){S.hero=d.equipHero;save();renderPage();toast(E.heroes[S.hero].name+'已归位');return}
 if(d.train){const h=S.heroes[d.train],cost=h.level*450;if(h.level<30&&S.gold>=cost){S.gold-=cost;h.level++;save();renderPage();AudioEngine.sfx('level');toast('修炼完成 · LV.'+h.level)}return}
 if(d.runeUp){const k=d.runeUp,cost=S.runes[k]*350;if(S.runes[k]<10&&S.gold>=cost){S.gold-=cost;S.runes[k]++;save();renderPage();toast(E.runes[k].name+'灵印升至 LV.'+S.runes[k])}return}
 if(d.slot!==undefined){openSlot(Number(d.slot));return}
 if(d.setRune){const k=d.setRune,i=Number(d.slotIndex);if(Number.isInteger(i)&&i>=0&&i<6&&(k==='none'||E.runes[k])){if(!S.loadouts[S.hero])S.loadouts[S.hero]=Array(6).fill(null);S.loadouts[S.hero][i]=k==='none'?null:k;save();closeModal();renderPage()}return}
 if(d.pickHero){S.hero=d.pickHero;save();refreshTop();launchView();return}
 if(d.difficulty){launch.difficulty=d.difficulty;launchView();return}
 if(d.upgrade){if(run&&E.choose(run,d.upgrade)){modalMode='';closeModal();paused=false;consumeEvents();save(true);updateHUD()}return}
 if(d.achievement){const a=achievements.find(x=>x.id===d.achievement);if(a&&a.test(S)&&!S.achievements.includes(a.id)){S.achievements.push(a.id);S.gems+=a.reward;save();renderPage();toast('成就达成 · +'+a.reward+' 天晶');AudioEngine.sfx('level')}return}
 if(d.task){dailyReset();const k=d.task;if(!S.daily.tasks.includes(k)&&((k==='kills'&&S.daily.kills>=20)||(k==='wins'&&S.daily.wins>=1))){S.daily.tasks.push(k);S.gold+=k==='kills'?600:800;S.gems+=k==='kills'?30:50;save();renderPage();toast('修行奖励已领取')}return}
 if(d.toggle){S.settings[d.toggle]=!S.settings[d.toggle];save();b.classList.toggle('on',S.settings[d.toggle]);b.setAttribute('aria-checked',S.settings[d.toggle]);return}
 if(d.skill!==undefined){d.skill==='dash'?dash():skill(Number(d.skill));return}
 switch(d.action){case'help':help();break;case'settings':settings();break;case'profile':profile();break;case'close':if(modalMode==='pause')unpause();else if(modalMode==='result')returnLobby();else closeModal();break;case'save-name':S.name=$('name-input').value.trim().slice(0,16)||'智阳使者';save();closeModal();renderPage();toast('星庭铭记你的名字');break;case'daily':dailyReset();if(!S.daily.claimed){S.daily.claimed=true;S.gold+=500;save();renderPage();toast('星庭馈赠 · +500 灵铢')}break;case'start':start();break;case'resume-save':resumeSaved();break;case'pause':pause();break;case'unpause':unpause();break;case'suspend':save(true);returnLobby();toast('冒险已保存，可随时继续');break;case'retreat':finish(true);break;case'return':returnLobby();break;case'again':{const l={...lastResult};if(run.phase==='won'&&l.mode==='campaign'&&l.chapter<5)l.chapter++;returnLobby();launch=l;launchModal(l.mode,l.chapter);break}case'reroll':if(E.reroll(run))showChoice();break;case'auto':if(run){run.auto=!run.auto;S.settings.auto=run.auto;save(true);updateHUD()}break;case'interact':if(run&&!paused){E.interact(run);consumeEvents();updateHUD()}break;case'export':exportSave();break;case'import':$('import-file').click();break;case'undo-import':{try{const data=JSON.parse(localStorage.getItem(KEY+'.backup'));S=E.sanitizeSave(data);S.suspended=E.restoreRun(data.suspended);dailyReset();save();closeModal();renderPage('home');toast('已恢复导入前的进度')}catch{toast('备份暂不可用',true)}break}case'auto-runes':S.loadouts[S.hero]=E.heroes[S.hero].ranged?['fire','fire','thunder','ice','water','dark']:['light','fire','water','earth','wood','dark'];save();renderPage();toast('推荐灵印已装配');break;case'fullscreen':{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>toast('此浏览器不支持全屏',true));else toast('此浏览器不支持全屏',true);break}}
});
document.addEventListener('input',e=>{if(e.target.dataset.setting==='volume'){S.settings.volume=Number(e.target.value);if(AudioEngine.gain)AudioEngine.gain.gain.value=S.settings.volume/100*.26;e.target.previousElementSibling.querySelector('small').textContent='音效与背景乐 · '+S.settings.volume+'%';save()}});
document.addEventListener('change',e=>{if(e.target.dataset.setting==='quality'){S.settings.quality=e.target.value;save()}});
$('import-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('存档文件过大');const data=JSON.parse(await f.text()),s=E.sanitizeSave(data);localStorage.setItem(KEY+'.backup',JSON.stringify(S));S=s;dailyReset();save();closeModal();renderPage('home');toast('存档已恢复，原进度已备份')}catch(err){toast('导入失败：'+err.message,true)}finally{e.target.value=''}});
$('modal').addEventListener('cancel',e=>{e.preventDefault();if(modalMode==='choice'){toast('选择一项天命赐福后继续');return}if(modalMode==='pause')unpause();else if(modalMode==='result')returnLobby();else closeModal()});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(k==='escape'||k==='p'){if(run&&!$('modal').open){e.preventDefault();pause()}return}if(!run||paused||$('modal').open)return;if([' ','arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','j','q','e','r','1','2','3','f'].includes(k))e.preventDefault();keys.add(k);if(e.repeat)return;AudioEngine.init();if(k===' ')dash();if(k==='q'||k==='1')skill(0);if(k==='e'||k==='2')skill(1);if(k==='r'||k==='3')skill(2);if(k==='f'){E.interact(run);consumeEvents()}});
document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function clearInput(){keys.clear();pointer.down=false;joy.x=joy.y=0;joy.active=false;$('joy-knob').style.transform='none'}
window.addEventListener('blur',()=>{clearInput();if(run&&!paused)pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(run&&!paused)pause();if(run)save(true)}else{dailyReset();lastFrame=performance.now()}});
$('arena').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;AudioEngine.init();pointer.down=true;pointer.aim=e.pointerType==='mouse';pointer.x=e.clientX;pointer.y=e.clientY;if(run&&!paused){if(vis.project){const c=vis.camera;E.step(run,0,{...getMovement(),autoAim:S.settings.aim,ax:c.x+(pointer.x-vis.w/2)/c.scale,ay:c.y+(pointer.y-vis.h*.52)/(c.scale*.64)})}E.attack(run);consumeEvents()}});
$('arena').addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;pointer.aim=e.pointerType==='mouse'});
$('arena').addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('pointerup',()=>{pointer.down=false});window.addEventListener('pointercancel',clearInput);
$('attack-btn').addEventListener('pointerdown',e=>{e.preventDefault();pointer.down=true;AudioEngine.init();if(run&&!paused){E.attack(run);consumeEvents()}});
const joystick=$('joystick');joystick.addEventListener('pointerdown',e=>{e.preventDefault();joy.active=true;joy.id=e.pointerId;joystick.setPointerCapture(e.pointerId);moveJoy(e)});joystick.addEventListener('pointermove',e=>{if(joy.active&&joy.id===e.pointerId)moveJoy(e)});joystick.addEventListener('pointerup',endJoy);joystick.addEventListener('pointercancel',endJoy);
function moveJoy(e){const r=joystick.getBoundingClientRect(),limit=r.width*.29,dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy)||1,k=Math.min(1,limit/d);joy.x=dx*k/limit;joy.y=dy*k/limit;$('joy-knob').style.transform=`translate(${dx*k}px,${dy*k}px)`}
function endJoy(){joy.active=false;joy.x=joy.y=0;$('joy-knob').style.transform='none'}
window.addEventListener('beforeunload',()=>save(!!run));
let frameAccumulator=0;
function frame(now){const delta=Math.min(.1,(now-(lastFrame||now))/1000);lastFrame=now;requestAnimationFrame(frame);if(document.hidden)return;AudioEngine.music();
 if(run){if(!paused&&run.phase==='playing'){const c=vis.camera,input={...getMovement(),attack:pointer.down||keys.has('j'),autoAim:S.settings.aim||!pointer.aim,ax:c.x+(pointer.x-vis.w/2)/c.scale,ay:c.y+(pointer.y-vis.h*.52)/(c.scale*.64)};frameAccumulator+=delta;let iterations=0;while(frameAccumulator>=1/60&&iterations++<5){E.step(run,1/60,input);frameAccumulator-=1/60;if(run.phase!=='playing')break}consumeEvents()}else frameAccumulator=0;
  if(!run)return;for(const f of vis.fx)f.t+=delta;vis.fx=vis.fx.filter(f=>f.t<f.life);if(S.settings.quality==='high'||now-lastPaint>=32){Painter.battle($('arena'),run,vis,now/1000,S.settings);lastPaint=now}if(now-lastHUD>100){updateHUD();lastHUD=now}if(now-lastAutoSave>7000&&!run.resultAwarded){save(true);lastAutoSave=now}
 }else if(now-lobbyFrame>1000/(S.settings.reduce?2:24)){drawPreviews(now/1000);lobbyFrame=now}}
save();renderPage();requestAnimationFrame(frame);if(migrated)setTimeout(()=>toast('原版昵称与资源已迁移，旧存档仍完整保留'),600);if(!storageOK)setTimeout(()=>toast('本地存储不可用，请用设置中的导出存档保存进度',true),1200);
})();

</script>
</body></html>
